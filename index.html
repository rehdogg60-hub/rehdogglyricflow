<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reh Dogg Lyric Flow</title>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0a0f;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(88, 30, 130, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(30, 60, 180, 0.12) 0%, transparent 60%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e8e4f0;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ── main card ── */
        .app {
            max-width: 820px;
            width: 100%;
            background: rgba(18, 16, 26, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.8rem;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s;
        }

        /* ── header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem 1.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-icon {
            font-size: 2.1rem;
            line-height: 1;
            filter: drop-shadow(0 0 8px rgba(160, 80, 255, 0.3));
        }

        .title {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0eaff 0%, #b388ff 50%, #7c6bff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(130, 80, 255, 0.15);
        }

        .title-sub {
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            -webkit-text-fill-color: rgba(255, 255, 255, 0.25);
            background: none;
            margin-left: 0.2rem;
        }

        .section-counter {
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 0.9rem;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
        }
        .section-counter span {
            color: #b388ff;
            font-weight: 700;
        }

        /* ── toolbar ── */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
        }

        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            border: none;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-family: inherit;
            flex: 0 1 auto;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.12);
        }
        .btn-add:active {
            transform: translateY(0px) scale(0.96);
        }

        .btn-add .icon {
            font-size: 1.05rem;
            line-height: 1;
        }

        /* section-type colors (applied to the button dot & section badge) */
        .type-intro .btn-add {
            background: rgba(76, 175, 80, 0.12);
            border-color: rgba(76, 175, 80, 0.2);
            color: #81c784;
        }
        .type-intro .btn-add:hover {
            background: rgba(76, 175, 80, 0.22);
            border-color: rgba(76, 175, 80, 0.4);
        }

        .type-verse .btn-add {
            background: rgba(33, 150, 243, 0.12);
            border-color: rgba(33, 150, 243, 0.2);
            color: #64b5f6;
        }
        .type-verse .btn-add:hover {
            background: rgba(33, 150, 243, 0.22);
            border-color: rgba(33, 150, 243, 0.4);
        }

        .type-bridge .btn-add {
            background: rgba(255, 152, 0, 0.12);
            border-color: rgba(255, 152, 0, 0.2);
            color: #ffb74d;
        }
        .type-bridge .btn-add:hover {
            background: rgba(255, 152, 0, 0.22);
            border-color: rgba(255, 152, 0, 0.4);
        }

        .type-chorus .btn-add {
            background: rgba(233, 30, 99, 0.12);
            border-color: rgba(233, 30, 99, 0.2);
            color: #f06292;
        }
        .type-chorus .btn-add:hover {
            background: rgba(233, 30, 99, 0.22);
            border-color: rgba(233, 30, 99, 0.4);
        }

        .type-outro .btn-add {
            background: rgba(156, 39, 176, 0.12);
            border-color: rgba(156, 39, 176, 0.2);
            color: #ce93d8;
        }
        .type-outro .btn-add:hover {
            background: rgba(156, 39, 176, 0.22);
            border-color: rgba(156, 39, 176, 0.4);
        }

        .type-break .btn-add {
            background: rgba(0, 188, 212, 0.12);
            border-color: rgba(0, 188, 212, 0.2);
            color: #4dd0e1;
        }
        .type-break .btn-add:hover {
            background: rgba(0, 188, 212, 0.22);
            border-color: rgba(0, 188, 212, 0.4);
        }

        /* ── sections container ── */
        .sections-container {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-bottom: 2rem;
            min-height: 100px;
            padding: 0.2rem 0;
        }

        .empty-state {
            text-align: center;
            padding: 2.8rem 1.5rem;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.95rem;
            border: 2px dashed rgba(255, 255, 255, 0.04);
            border-radius: 1.8rem;
            transition: all 0.3s;
        }
        .empty-state .big-icon {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 0.6rem;
            opacity: 0.5;
        }
        .empty-state .hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.08);
        }

        /* ── individual section card ── */
        .section-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1.4rem;
            padding: 1.1rem 1.4rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            transition: all 0.2s;
        }
        .section-card:hover {
            border-color: rgba(255, 255, 255, 0.07);
            background: rgba(255, 255, 255, 0.04);
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.4);
        }
        .section-label .badge {
            display: inline-block;
            padding: 0.15rem 0.7rem;
            border-radius: 100px;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
        }
        /* badge colors per type */
        .section-card[data-type="intro"] .badge {
            background: rgba(76, 175, 80, 0.2);
            color: #81c784;
        }
        .section-card[data-type="verse"] .badge {
            background: rgba(33, 150, 243, 0.2);
            color: #64b5f6;
        }
        .section-card[data-type="bridge"] .badge {
            background: rgba(255, 152, 0, 0.2);
            color: #ffb74d;
        }
        .section-card[data-type="chorus"] .badge {
            background: rgba(233, 30, 99, 0.2);
            color: #f06292;
        }
        .section-card[data-type="outro"] .badge {
            background: rgba(156, 39, 176, 0.2);
            color: #ce93d8;
        }
        .section-card[data-type="break"] .badge {
            background: rgba(0, 188, 212, 0.2);
            color: #4dd0e1;
        }

        .section-number {
            font-size: 0.65rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.15);
            margin-left: 0.2rem;
        }

        .btn-delete {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.12);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            transition: all 0.15s;
            line-height: 1;
        }
        .btn-delete:hover {
            color: #ef5350;
            background: rgba(239, 83, 80, 0.08);
        }

        .section-card textarea {
            width: 100%;
            min-height: 70px;
            padding: 0.7rem 0.9rem;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 1rem;
            color: #e8e4f0;
            font-size: 0.95rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            resize: vertical;
            transition: all 0.2s;
            outline: none;
        }
        .section-card textarea:focus {
            border-color: rgba(179, 136, 255, 0.25);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(179, 136, 255, 0.05);
        }
        .section-card textarea::placeholder {
            color: rgba(255, 255, 255, 0.08);
            font-style: italic;
        }

        /* ── action row ── */
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.4rem;
        }

        .btn-create {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 100px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            background: linear-gradient(135deg, #7c4dff, #b388ff);
            color: #fff;
            box-shadow: 0 6px 28px rgba(124, 77, 255, 0.25);
            transition: all 0.25s ease;
            letter-spacing: 0.02em;
        }
        .btn-create:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 40px rgba(124, 77, 255, 0.35);
        }
        .btn-create:active {
            transform: translateY(0px) scale(0.97);
        }
        .btn-create:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-clear-all {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 100px;
            transition: all 0.15s;
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .btn-clear-all:hover {
            color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.06);
        }

        /* ── output area ── */
        .output-section {
            margin-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.8rem;
            display: none;
        }
        .output-section.visible {
            display: block;
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .output-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.6rem 1rem;
            margin-bottom: 1rem;
        }
        .output-header h3 {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
        }
        .output-actions {
            display: flex;
            gap: 0.5rem;
        }
        .btn-copy {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .output-box {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 1.4rem;
            padding: 1.6rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            white-space: pre-wrap;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 0.95rem;
            line-height: 1.8;
            color: #d4cee8;
            max-height: 500px;
            overflow-y: auto;
            position: relative;
        }
        .output-box .section-head {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 1.2rem;
            margin-bottom: 0.2rem;
            padding-bottom: 0.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .output-box .section-head:first-child {
            margin-top: 0;
        }
        .output-box .section-body {
            display: block;
            padding-left: 0.2rem;
            color: #e8e4f0;
        }
        .output-box .section-body:last-child {
            margin-bottom: 0;
        }

        /* ── scrollbar ── */
        .output-box::-webkit-scrollbar {
            width: 4px;
        }
        .output-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }
        .output-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        /* ── responsive ── */
        @media (max-width: 600px) {
            body {
                padding: 1rem 0.8rem;
            }
            .app {
                padding: 1.2rem 1rem 1.8rem;
                border-radius: 1.8rem;
            }
            .title {
                font-size: 1.3rem;
            }
            .logo-icon {
                font-size: 1.6rem;
            }
            .header {
                margin-bottom: 1.2rem;
                padding-bottom: 0.8rem;
            }
            .toolbar {
                gap: 0.35rem;
            }
            .btn-add {
                font-size: 0.7rem;
                padding: 0.4rem 0.8rem;
                gap: 0.25rem;
            }
            .btn-add .icon {
                font-size: 0.85rem;
            }
            .section-card {
                padding: 0.8rem 0.9rem 0.9rem;
                border-radius: 1.2rem;
            }
            .section-card textarea {
                font-size: 0.85rem;
                min-height: 56px;
                padding: 0.5rem 0.7rem;
            }
            .output-box {
                padding: 1rem 1.2rem;
                font-size: 0.85rem;
            }
            .btn-create {
                padding: 0.6rem 1.4rem;
                font-size: 0.85rem;
            }
            .section-counter {
                font-size: 0.65rem;
                padding: 0.2rem 0.6rem;
            }
            .action-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-create {
                justify-content: center;
            }
            .btn-clear-all {
                align-self: flex-end;
            }
        }

        @media (max-width: 400px) {
            .toolbar {
                gap: 0.25rem;
            }
            .btn-add {
                font-size: 0.6rem;
                padding: 0.3rem 0.6rem;
            }
            .btn-add .icon {
                font-size: 0.7rem;
            }
            .title {
                font-size: 1.1rem;
            }
            .logo-icon {
                font-size: 1.3rem;
            }
            .section-label {
                font-size: 0.65rem;
            }
            .section-card textarea {
                font-size: 0.8rem;
                min-height: 48px;
            }
        }

        /* ── toast ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(18, 16, 26, 0.92);
            backdrop-filter: blur(12px);
            padding: 0.6rem 1.6rem;
            border-radius: 100px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            white-space: nowrap;
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- header -->
        <div class="header">
            <div class="header-left">
                <span class="logo-icon">🎤</span>
                <span class="title">Reh Dogg Lyric Flow</span>
                <span class="title-sub">· studio</span>
            </div>
            <div class="section-counter" id="sectionCounter">
                <span id="countDisplay">0</span> sections
            </div>
        </div>

        <!-- toolbar -->
        <div class="toolbar" id="toolbar">
            <button class="btn-add type-intro" data-type="intro">
                <span class="icon">🎬</span> Intro
            </button>
            <button class="btn-add type-verse" data-type="verse">
                <span class="icon">📝</span> Verse
            </button>
            <button class="btn-add type-bridge" data-type="bridge">
                <span class="icon">🌉</span> Bridge
            </button>
            <button class="btn-add type-chorus" data-type="chorus">
                <span class="icon">🎶</span> Chorus
            </button>
            <button class="btn-add type-outro" data-type="outro">
                <span class="icon">🏁</span> Outro
            </button>
            <button class="btn-add type-break" data-type="break">
                <span class="icon">🔥</span> Break
            </button>
        </div>

        <!-- sections -->
        <div class="sections-container" id="sectionsContainer">
            <div class="empty-state" id="emptyState">
                <span class="big-icon">✍️</span>
                Add a section above to start writing<br />
                <span class="hint">click any button to begin</span>
            </div>
        </div>

        <!-- action row -->
        <div class="action-row">
            <button class="btn-create" id="btnCreate" disabled>
                <span>⚡</span> Create Lyric Flow
            </button>
            <button class="btn-clear-all" id="btnClearAll">clear all</button>
        </div>

        <!-- output -->
        <div class="output-section" id="outputSection">
            <div class="output-header">
                <h3>📋 compiled lyrics</h3>
                <div class="output-actions">
                    <button class="btn-copy" id="btnCopy">copy</button>
                </div>
            </div>
            <div class="output-box" id="outputBox"></div>
        </div>
    </div>

    <!-- toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const container = document.getElementById('sectionsContainer');
            const emptyState = document.getElementById('emptyState');
            const countDisplay = document.getElementById('countDisplay');
            const btnCreate = document.getElementById('btnCreate');
            const btnClearAll = document.getElementById('btnClearAll');
            const outputSection = document.getElementById('outputSection');
            const outputBox = document.getElementById('outputBox');
            const btnCopy = document.getElementById('btnCopy');
            const toast = document.getElementById('toast');

            // ── state ──
            let sections = []; // { id, type, text }
            let nextId = 1;
            let toastTimer = null;

            // ── helpers ──
            function getTypeLabel(type) {
                const map = {
                    intro: 'Intro',
                    verse: 'Verse',
                    bridge: 'Bridge',
                    chorus: 'Chorus',
                    outro: 'Outro',
                    break: 'Break'
                };
                return map[type] || type;
            }

            function getTypeEmoji(type) {
                const map = {
                    intro: '🎬',
                    verse: '📝',
                    bridge: '🌉',
                    chorus: '🎶',
                    outro: '🏁',
                    break: '🔥'
                };
                return map[type] || '◆';
            }

            function getTypeCount(type) {
                return sections.filter(s => s.type === type).length;
            }

            function getTypeNumber(type) {
                return getTypeCount(type) + 1;
            }

            function updateCounter() {
                const count = sections.length;
                countDisplay.textContent = count;
                btnCreate.disabled = count === 0;
                if (count === 0) {
                    emptyState.style.display = 'block';
                } else {
                    emptyState.style.display = 'none';
                }
                // hide output if no sections
                if (count === 0) {
                    outputSection.classList.remove('visible');
                }
            }

            function renderSections() {
                // remove all cards but keep empty state
                const cards = container.querySelectorAll('.section-card');
                cards.forEach(el => el.remove());

                // re-append in order
                sections.forEach((sec, index) => {
                    const card = createSectionCard(sec, index);
                    container.appendChild(card);
                });

                // show/hide empty state
                updateCounter();

                // auto-focus first textarea of new section? we handle in add
            }

            function createSectionCard(sec, index) {
                const card = document.createElement('div');
                card.className = 'section-card';
                card.dataset.type = sec.type;
                card.dataset.id = sec.id;

                const typeLabel = getTypeLabel(sec.type);
                const emoji = getTypeEmoji(sec.type);
                const num = getTypeNumber(sec.type) - 1; // the count before this one

                // header
                const header = document.createElement('div');
                header.className = 'section-header';

                const label = document.createElement('div');
                label.className = 'section-label';
                label.innerHTML = `
                    <span>${emoji}</span>
                    <span class="badge">${typeLabel}</span>
                    <span class="section-number">#${num}</span>
                `;

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-delete';
                delBtn.textContent = '✕';
                delBtn.setAttribute('aria-label', 'Delete section');
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteSection(sec.id);
                });

                header.appendChild(label);
                header.appendChild(delBtn);

                // textarea
                const textarea = document.createElement('textarea');
                textarea.placeholder = `Write your ${typeLabel.toLowerCase()} lyrics here…`;
                textarea.value = sec.text || '';
                textarea.addEventListener('input', (e) => {
                    sec.text = e.target.value;
                    // auto-resize
                    e.target.style.height = 'auto';
                    e.target.style.height = e.target.scrollHeight + 'px';
                });
                // initial auto-resize after render
                requestAnimationFrame(() => {
                    textarea.style.height = 'auto';
                    textarea.style.height = textarea.scrollHeight + 'px';
                });

                // focus on mount if it's the newest
                // we'll focus in add function

                card.appendChild(header);
                card.appendChild(textarea);

                return card;
            }

            function deleteSection(id) {
                const index = sections.findIndex(s => s.id === id);
                if (index === -1) return;
                sections.splice(index, 1);
                renderSections();
                // hide output if sections empty
                if (sections.length === 0) {
                    outputSection.classList.remove('visible');
                }
                showToast('Section removed');
            }

            function addSection(type) {
                const newSec = {
                    id: nextId++,
                    type: type,
                    text: ''
                };
                sections.push(newSec);
                renderSections();

                // focus the new textarea
                const cards = container.querySelectorAll('.section-card');
                const lastCard = cards[cards.length - 1];
                if (lastCard) {
                    const ta = lastCard.querySelector('textarea');
                    if (ta) {
                        setTimeout(() => ta.focus(), 50);
                    }
                }

                // hide output if it was visible
                outputSection.classList.remove('visible');

                showToast(`Added ${getTypeLabel(type)}`);
            }

            function clearAll() {
                if (sections.length === 0) return;
                if (!confirm('Clear all lyrics?')) return;
                sections = [];
                renderSections();
                outputSection.classList.remove('visible');
                showToast('All cleared');
            }

            // ── create / compile ──
            function compileLyrics() {
                const nonEmpty = sections.filter(s => s.text.trim().length > 0);
                if (nonEmpty.length === 0) {
                    showToast('Write some lyrics first! ✍️');
                    return;
                }

                let result = '';
                sections.forEach((sec, idx) => {
                    const label = getTypeLabel(sec.type);
                    const emoji = getTypeEmoji(sec.type);
                    const num = idx + 1;
                    // count how many of this type before
                    const typeIndex = sections.filter((s, i) => s.type === sec.type && i <= idx).length;
                    const header = `[${label} ${typeIndex}]`;
                    const body = sec.text.trim() || '(empty)';
                    result += `${header}\n${body}`;
                    if (idx < sections.length - 1) result += '\n\n';
                });

                // display
                outputBox.innerHTML = formatOutput(result);
                outputSection.classList.add('visible');
                outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

                showToast(`✨ Compiled ${sections.length} sections`);
            }

            function formatOutput(raw) {
                // split by double newline to separate sections
                const parts = raw.split(/\n\n/);
                let html = '';
                parts.forEach((part, i) => {
                    const lines = part.split('\n');
                    if (lines.length === 0) return;
                    const header = lines[0];
                    const body = lines.slice(1).join('\n');
                    html += `<span class="section-head">${header}</span>`;
                    html += `<span class="section-body">${escapeHtml(body)}</span>`;
                    if (i < parts.length - 1) html += '\n';
                });
                return html;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ── copy ──
            function copyOutput() {
                const text = outputBox.textContent;
                if (!text || text.trim().length === 0) {
                    showToast('Nothing to copy');
                    return;
                }
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 Copied to clipboard!');
                }).catch(() => {
                    // fallback
                    const range = document.createRange();
                    range.selectNode(outputBox);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                    showToast('📋 Copied!');
                });
            }

            // ── toast ──
            function showToast(msg) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2000);
            }

            // ── event bindings ──
            document.getElementById('toolbar').addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-add');
                if (!btn) return;
                const type = btn.dataset.type;
                if (type) addSection(type);
            });

            btnCreate.addEventListener('click', compileLyrics);

            btnClearAll.addEventListener('click', clearAll);

            btnCopy.addEventListener('click', copyOutput);

            // keyboard shortcut: Ctrl+Enter to create
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    if (sections.length > 0) compileLyrics();
                }
            });

            // ── init ──
            renderSections();

            // add a couple demo sections to get started
            addSection('intro');
            // small delay then add verse
            setTimeout(() => {
                addSection('verse');
            }, 200);
            setTimeout(() => {
                addSection('chorus');
            }, 400);

            // focus the first textarea after a moment
            setTimeout(() => {
                const firstTa = container.querySelector('.section-card textarea');
                if (firstTa) firstTa.focus();
            }, 600);

        })();
    </script>

</body>
</html>
